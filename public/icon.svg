<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F213E" />
      <stop offset="100%" stop-color="#163360" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93B" />
      <stop offset="100%" stop-color="#C98A1E" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#C98A1E" stroke-opacity="0.35" stroke-width="6" />
  <g transform="translate(256 248)">
    <!-- 8-point Islamic geometric star -->
    <rect x="-92" y="-92" width="184" height="184" rx="18" fill="none" stroke="url(#gold)" stroke-width="16" />
    <rect x="-92" y="-92" width="184" height="184" rx="18" transform="rotate(45)" fill="none" stroke="url(#gold)" stroke-width="16" />
    <!-- Open book inside -->
    <path d="M-64,14 Q-32,-4 0,10 Q32,-4 64,14 L64,54 Q32,36 0,50 Q-32,36 -64,54 Z" fill="#FAF8F3" />
    <path d="M0,10 L0,50" stroke="#0F766E" stroke-width="6" stroke-linecap="round" />
